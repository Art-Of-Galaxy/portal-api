# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Generated by `shopify app config link --client-id 553bb70674bcf4aeabd024ee60f3819e`.
# The [webhooks.subscriptions] entries below were merged in from
# shopify.app.toml.example; everything else is the app's live config as
# pulled from Shopify, left untouched on purpose.

client_id = "553bb70674bcf4aeabd024ee60f3819e"
name = "Art Of Galaxy Blog Engine"
application_url = "https://portal.artofgalaxy.com"
embedded = false

[webhooks]
api_version = "2026-04"

# Absolute URLs are required. A relative uri resolves against
# application_url, which is the portal frontend; the handlers live on the
# API host. All four are implemented in shopify-connections/webhooks.js
# and verified live against api.artofgalaxy.com.

# --- mandatory compliance topics (public apps only) ---
[[webhooks.subscriptions]]
uri = "https://api.artofgalaxy.com/api/shopify/webhooks/customers/data_request"
compliance_topics = [ "customers/data_request" ]

[[webhooks.subscriptions]]
uri = "https://api.artofgalaxy.com/api/shopify/webhooks/customers/redact"
compliance_topics = [ "customers/redact" ]

[[webhooks.subscriptions]]
uri = "https://api.artofgalaxy.com/api/shopify/webhooks/shop/redact"
compliance_topics = [ "shop/redact" ]

# --- app lifecycle ---
# Declared here rather than registered per shop after OAuth, so it also
# applies to stores that installed before this was added.
[[webhooks.subscriptions]]
uri = "https://api.artofgalaxy.com/api/shopify/webhooks/app/uninstalled"
topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,write_files,read_content,write_content"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://api.artofgalaxy.com/api/shopify-connections/callback"
]
